name: Watchdog

# 서버 워크플로가 하나도 실행/대기 중이 아니면 다시 띄움 (크래시·취소 대비)
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Start server if none running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(gh run list --repo "$REPO" --workflow server.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          echo "active runs: $n"
          if [ "$n" -eq 0 ]; then
            gh workflow run server.yml --repo "$REPO"
          fi
